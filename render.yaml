services:
  - type: web
    name: flowchainai-backend
    runtime: python
    pythonVersion: "3.12.3"
    region: singapore  # closest to Neon DB region (ap-southeast-1)
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false  # set manually in Render dashboard
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: BACKEND_CORS_ORIGINS
        sync: false  # set to your Vercel frontend URL
      - key: FORCE_HTTPS
        value: "true"
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: AI_PROVIDER
        sync: false
      - key: AI_MODEL
        sync: false
      - key: AI_FALLBACK_MODEL
        sync: false
      - key: AI_BASE_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_REQUEST_TIMEOUT_SECONDS
        value: 60
