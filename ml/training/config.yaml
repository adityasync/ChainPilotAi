# ML Training Configuration
# Supply Chain SaaS Platform
# ===========================

# Data Configuration
data:
  processed_dir: "data/processed"
  raw_dir: "data/raw"
  samples_dir: "data/samples"

# Model Output Configuration
models:
  output_dir: "backend/app/ml/models"
  
# Demand Forecasting Configuration
demand_forecasting:
  model_type: "random_forest"  # Options: linear_regression, random_forest
  hyperparameters:
    n_estimators: 100
    max_depth: null
    min_samples_split: 2
    min_samples_leaf: 1
    random_state: 42
  features:
    - year
    - month
    - day_of_week
    - quarter
    - product_encoded
  target: "Quantity"
  test_size: 0.2

# Inventory Risk Classifier Configuration
inventory_risk:
  model_type: "random_forest"  # Options: random_forest, logistic_regression
  hyperparameters:
    n_estimators: 100
    max_depth: null
    random_state: 42
  features:
    - Availability
    - Number of products sold
    - Revenue generated
    - Stock levels
    - Lead times
    - Order quantities
    - Shipping costs
    - Price
  target: "inventory_risk_label"
  test_size: 0.2

# Supplier Delay Predictor Configuration
supplier_delay:
  model_type: "xgboost"  # Options: logistic_regression, xgboost
  hyperparameters:
    n_estimators: 100
    learning_rate: 0.1
    max_depth: 6
    random_state: 42
  features:
    - Lead times
    - Order quantities
    - Shipping costs
  target: "supplier_delay_label"
  test_size: 0.2

# Cost Anomaly Detector Configuration
cost_anomaly:
  model_type: "isolation_forest"
  hyperparameters:
    n_estimators: 100
    contamination: 0.1
    random_state: 42
  features:
    - Shipping costs
    - Price
    - Revenue generated

# Training Configuration
training:
  cross_validation: true
  cv_folds: 5
  verbose: true
  save_models: true
  save_metrics: true

# Logging Configuration
logging:
  level: "INFO"
  file: "training.log"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# Evaluation Configuration
evaluation:
  metrics:
    classification:
      - accuracy
      - precision
      - recall
      - f1
      - roc_auc
    regression:
      - rmse
      - mae
      - r2
      - mape
